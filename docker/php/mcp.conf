# Az MCP-végpont rövid, szabványos címe: /mcp  →  public/mcp.php
Alias /mcp /var/www/html/public/mcp.php

# Helyszínképek (a webtárhelyen ezt a .htaccess intézi)
Alias /assets/images /var/www/html/assets/images
<Directory /var/www/html/assets/images>
    Options -Indexes
    Require all granted
</Directory>
