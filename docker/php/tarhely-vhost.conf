# Tárhely-szimuláció: úgy viselkedik, mint egy kötött public_html-es webtárhely.
# A projekt gyökere a webgyökér, és a .htaccess fájlok érvényesek.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
